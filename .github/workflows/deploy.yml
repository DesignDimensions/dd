name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The studio (CMS) the site reads its content from — set the
      # VITE_CMS_URL repository variable, e.g. https://designdimensions.in/studio.
      # Unset, the site shows the content it was built with.
      - run: npm run build
        env:
          VITE_CMS_URL: ${{ vars.VITE_CMS_URL }}

      # SPA fallback: deep links like /dd/about must serve the app shell.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
